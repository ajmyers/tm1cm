# Processes:
#   The TI processes to include, by name. The include filter picks them, then the exclude filter
#   takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Format: <ProcessName>
#   Examples:
#      - Actual.Call.* -- every process whose name starts with Actual.Call.
#      - * -- every process

include_process: '*'
exclude_process:
  - '}tp*'

# TI formatting:
#   true formats every TI process the same way (case, indentation and spacing) as it is written to
#   its file, so that two copies of a process differ only where their code does.
autoformat_ti_process: true

# Cubes:
#   The cubes to include, by name. The include filter picks them, then the exclude filter takes
#   some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   The defaults leave out TM1's own control cubes, whose names start with }, apart from those
#   worth keeping, such as }ClientGroups.
#
#   Format: <CubeName>
#   Examples:
#      - Sales* -- every cube whose name starts with Sales
#      - }ClientGroups -- the cube of which groups each client is in

include_cube: '*'
exclude_cube:
  - '}ClientCAMAssociatedGroups'
  - '}ClientProperties'
  - '}ClientSettings'
  - '}ElementProperties*'
  - '}HierarchyProperties'
  - '}Stats*'
  - '}Hold*'
  - '}CubeProperties'
  - '}DimensionProperties'
  - '}ElementAttributes_}*'
  - '}ElementAttributes_}Clients'
  - '}Capabilities'
  - '}CubeSecurityProperties'
  - '}PickList*'
  - '*}tp*'
  - '}CellAnnotations*'

# Rules:
#   The cubes whose rules to include, by name. The include filter picks them, then the exclude
#   filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Format: <CubeName>
#   Examples:
#      - Sales* -- the rules of every cube whose name starts with Sales
#      - * -- every cube's rules

include_rule: '*'
exclude_rule: ''

# Cube views:
#   The cubes' views to include, by name. The include filter picks them, then the exclude filter
#   takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Only a view's definition, not its data (see Cube view data). Include the subsets a view uses
#   too (Subsets), or putting it fails.
#
#   Only public views.
#
#   Format: <CubeName>/<ViewName>
#   Examples:
#      - Sales/Default -- the Default view of the Sales cube
#      - */Default -- the Default view of every cube
#      - Sales/* -- every view of the Sales cube

include_cube_view: '*/*'
exclude_cube_view: ''

# Cube view data:
#   The views whose cell values to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   For small sets of values, such as a control cube's, not for moving large amounts of data.
#
#   Only public views. Turn off zero suppression in the view, or a cell cleared on one side stays
#   set on the other.
#
#   Format: <CubeName>/<ViewName>
#   Examples:
#      - Control/Settings -- the values of the Settings view of the Control cube
#      - */Migrate -- the values of the Migrate view of every cube

include_cube_view_data: ''
exclude_cube_view_data: ''

# Dimensions:
#   The dimensions to include, by name. The include filter picks them, then the exclude filter
#   takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   A dimension holds its hierarchies, and moves without them: include its hierarchies too
#   (Hierarchies). The defaults leave out TM1's own dimensions, whose names start with }.
#
#   Format: <DimensionName>
#   Examples:
#      - af* -- every dimension whose name starts with af
#      - *_Measure -- every dimension whose name ends in _Measure

include_dimension: '*'
exclude_dimension:
  - '}Stats*'
  - '}Hierarchies*'
  - '}ApplicationEntries'
  - '}CAMAssociatedGroups'
  - '}Chores'
  - '}Client*'
  - '}Connection*'
  - '}Cube Functions'
  - '}CubeProperties'
  - '}CubeSecurityProperties'
  - '}Cubes'
  - '}Cultures'
  - '}DimensionFormatAttributes'
  - '}DimensionFormatItems'
  - '}DimensionProperties'
  - '}ElementAttributes_}*'
  - '}ElementProperties'
  - '}Features'
  - '}Groups'
  - '}PickList'
  - '}Processes'
  - '}RuleStats'
  - '}Subsets*'
  - '}Views*'
  - '}*'
  - 'Sandboxes'

# Hierarchies:
#   The dimensions' hierarchies to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Which of their elements, edges, attributes and attribute values move with them are filters of
#   their own, below.
#
#   Format: <DimensionName>/<HierarchyName>
#   Examples:
#      - Region/Region -- the Region dimension's main hierarchy
#      - Region/* -- every hierarchy of the Region dimension

include_dimension_hierarchy: '*/*'
exclude_dimension_hierarchy:
  - '}*/*'
  - '*/Leaves'

# Hierarchy elements:
#   The hierarchies whose elements to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Leave out the elements of a hierarchy that another system maintains (a feed from an ERP, say):
#   a put would undo what that system did. A hierarchy whose elements are left out is put without
#   them, and keeps its elements on TM1.
#
#   Format: <DimensionName>/<HierarchyName>
#   Examples:
#      - Region/Region -- the elements of the Region dimension's main hierarchy
#      - Region/* -- the elements of every hierarchy of the Region dimension

include_dimension_hierarchy_element: '*/*'
exclude_dimension_hierarchy_element: ''

# Hierarchy edges:
#   The hierarchies whose edges to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Edges are a hierarchy's parent and child relationships, and their weights.
#
#   Format: <DimensionName>/<HierarchyName>
#   Examples:
#      - Region/Region -- the edges of the Region dimension's main hierarchy
#      - Region/* -- the edges of every hierarchy of the Region dimension

include_dimension_hierarchy_edge: '*/*'
exclude_dimension_hierarchy_edge: ''

# Hierarchy attributes:
#   The hierarchies' attributes to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   The attributes themselves, not their values: those are the next filter's.
#
#   Format: <DimensionName>/<HierarchyName>/<AttributeName>
#   Examples:
#      - Region/Region/* -- every attribute of the Region dimension's main hierarchy
#      - Region/*/Caption -- the Caption attribute of every hierarchy of the Region dimension
#      - */*/Caption -- the Caption attribute of every hierarchy

include_dimension_hierarchy_attribute: '*/*/*'
exclude_dimension_hierarchy_attribute: '*/*/}SYS*'

# Hierarchy attribute values:
#   The attributes whose values to include, by name. The include filter picks them, then the
#   exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   The values of the elements that are included (Hierarchy elements).
#
#   Format: <DimensionName>/<HierarchyName>/<AttributeName>
#   Examples:
#      - Region/Region/* -- every attribute value of the Region dimension's main hierarchy
#      - */*/Caption -- the Caption values of every hierarchy

include_dimension_hierarchy_attribute_value: '*/*/*'
exclude_dimension_hierarchy_attribute_value: ''

# Subsets:
#   The hierarchies' subsets to include, by name. The include filter picks them, then the exclude
#   filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Only public subsets, static or dynamic (MDX).
#
#   Format: <DimensionName>/<HierarchyName>/<SubsetName>
#   Examples:
#      - Region/Region/* -- every subset of the Region dimension's main hierarchy
#      - */*/Level 0 -- every subset named Level 0

include_dimension_hierarchy_subset: ''
exclude_dimension_hierarchy_subset: ''

# Applications:
#   The applications: their folders, documents, links and references to include, by name. The
#   include filter picks them, then the exclude filter takes some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Format: <Folder>/<Folder>/<Name>
#   Examples:
#      - Finance/* -- everything in the Finance folder
#      - */Budget* -- everything whose name starts with Budget, in any folder

include_application: '*'
exclude_application: ''

# Chores:
#   The chores to include, by name. The include filter picks them, then the exclude filter takes
#   some away again.
#
#   Each filter is one pattern or a list of them, and * matches any characters.
#
#   Format: <ChoreName>
#   Examples:
#      - * -- every chore
#      - Nightly* -- every chore whose name starts with Nightly

include_chore: '*'
exclude_chore: ''

# Backup before migrating:
#   A TI process that the interactive shell runs before its do command, to back up the server
#   first. These settings only apply to the interactive shell: get and put never run it.
#
#   backup_on_migrate: true runs it by default.
#
#   backup_allow_override: true asks each time whether to run it.
#
#   backup_process: the name of the process.

backup_on_migrate: false
backup_allow_override: false
backup_process: ''

# File format:
#   YAML or JSON: the format of the objects' files. YAML is easier to read and to review.
text_output_format: YAML

# File operations:
#   Not supported yet: leave these as they are.
do_file_operations: false
file_to_blob_update_process: ''
include_file: ''
exclude_file: ''

# Each type's files:
#   The folder each type's files are in, and their extension. Leave these as they are: other
#   projects and tools expect them.
cube_path: data/cube
cube_ext: .cube
rule_path: data/rule
rule_ext: .rule
view_path: data/view
view_ext: .view
view_data_path: data/view_data
view_data_ext: .view_data
subset_path: data/subset
subset_ext: .subset
dimension_path: data/dimension
dimension_ext: .dimension
hierarchy_path: data/hierarchy
hierarchy_ext: .hierarchy
process_path: data/process
process_ext: .process
chore_path: data/chore
chore_ext: .chore
application_path: data/application
application_ext: .application
