# Release: tm1cm to PyPI.
#
#   Real release: set VERSION in setup.py, merge that to master, then push the tag: v plus that
#                 version (v1.0.1). Publishes it to PyPI, permanently.
#   Dry run:      run this workflow manually (Actions tab, or `gh workflow run release.yml`):
#                 builds and tests the package as 0.0.0.dev<run number>, and uploads nothing.
#                 Pull requests that change the packaging get one too.
#   Pre-release:  a manual run with version set (1.1.0.dev1, 1.1.0rc1) publishes that version.
#                 A version can never be reused on PyPI, even after deleting it.
#
# Nothing is published until everything has passed on the commit being released:
#
#   plan       the version, and whether this run publishes
#   on-master  a tag must be a commit of master
#   ci         the whole of CI (ci.yml): lint and tests on every Python tm1cm supports
#   package    the wheel and sdist built with the release's version, and checked
#   install    those files, each installed into an empty environment on every supported Python,
#              and run: the command, the scaffold, and the test suite against the installed
#              package; the same files are kept for the publish job
#   gate       passes only when all of the above did
#   publish    after the gate: PyPI gets the very files that were tested
#
# No secret is needed: PyPI trusts this workflow by name (tm1cm's Publishing settings on PyPI), so
# renaming this file, or moving the publish step out of it, breaks publishing.
name: Release

on:
  push:
    tags: ['v*']
  # A dry run on changes to the packaging, so a package that can't install fails there, not at a tag
  pull_request:
    paths:
      - .github/workflows/release.yml
      - setup.py
      - setup.cfg
      - pyproject.toml
      - MANIFEST.in
  workflow_dispatch:
    inputs:
      version:
        description: Publish this pre-release to PyPI (e.g. 1.1.0.dev1 or 1.1.0rc1). Empty builds and tests without publishing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose the version, and whether to publish
        id: plan
        # Passed via env, never interpolated into the script, so an input can't inject shell
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          source_version=$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"$", open("setup.py").read(), re.M).group(1))')
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            # The source says what was released: the tag must be setup.py's version
            if [ "$version" != "$source_version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME doesn't match setup.py's VERSION ($source_version): set it there first" >&2
              exit 1
            fi
            out version "$version"; out publish true
          elif [ -n "$INPUT_VERSION" ]; then
            # Only a pre-release by hand: a final version comes from a tag
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(\.dev|a|b|rc)[0-9]+$'; then
              echo "::error::version must be a pre-release such as 1.1.0.dev1 or 1.1.0rc1, not '$INPUT_VERSION'" >&2
              exit 1
            fi
            out version "$INPUT_VERSION"; out publish true
          else
            out version "0.0.0.dev$GITHUB_RUN_NUMBER"; out publish false
          fi

  # A tag anywhere else would publish code that master's checks never saw
  on-master:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is a commit of master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't a commit of master: nothing is published" >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  # The wheel and sdist with the release's version, built and checked; the install job tests them
  package:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set version ${{ needs.plan.outputs.version }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed -i -E "s/^VERSION = \".*\"$/VERSION = \"$VERSION\"/" setup.py
          grep -q "^VERSION = \"$VERSION\"$" setup.py
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          ls dist
          test "$(ls dist | wc -l)" -eq 2
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist
          if-no-files-found: error

  # The very files the publish job uploads, each installed into an empty environment on every
  # Python tm1cm supports, and run: the command, the scaffold's files (package data, so only there
  # if the package carries them), and the test suite against the installed package rather than
  # the source. The tests that need TM1 skip, as in CI.
  install:
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pytest.ini
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist
      - name: Install the ${{ matrix.kind }}
        env:
          KIND: ${{ matrix.kind }}
        run: |
          case "$KIND" in wheel) package=$(ls dist/*.whl) ;; sdist) package=$(ls dist/*.tar.gz) ;; esac
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install --quiet "$package[test]"
      # Away from the checkout, so nothing can be imported from it but the tests
      - name: Run it
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          env/bin/python -c "import importlib.metadata as m, sys; v = m.version('tm1cm'); sys.exit(v != '$VERSION' and f'installed {v}, not $VERSION')"
          env/bin/tm1cm --help > /dev/null
          env/bin/tm1cm --mode scaffold --path project --log scaffold.log
          for f in .gitignore config/default/connect.yaml config/default/credentials.yaml config/default/tm1cm.yaml; do
            test -f "project/$f" || { echo "::error::the package scaffolded no $f" >&2; exit 1; }
          done
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          mkdir suite
          cp -R "$GITHUB_WORKSPACE/tests" "$GITHUB_WORKSPACE/pytest.ini" suite/
          cd suite
          ../env/bin/python -c "import tm1cm, sys; sys.exit('site-packages' not in tm1cm.__file__ and f'tm1cm imported from {tm1cm.__file__}')"
          ../env/bin/python -m pytest -q

  # What the publish job waits for: it passes only when CI, the package and every install did, and
  # the tag is on master. It always runs: a job skipped because one it needs failed would let the job after it
  # start. on-master is skipped for a manual run, which has no tag.
  gate:
    if: always()
    needs: [plan, on-master, ci, package, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          # A manual run or a pull request has no tag to check
          MANUAL: ${{ github.event_name != 'push' }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --argjson manual "$MANUAL" \
            'to_entries | all(.value.result == "success" or (.key == "on-master" and $manual and .value.result == "skipped"))' > /dev/null

  # Names the gate's result: without a status check of its own in "if", a job is skipped when any
  # job before it was, however far back, and a manual run skips on-master
  publish:
    needs: [plan, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # PyPI takes this job's identity token instead of a password (trusted publishing)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist
      - name: Publish ${{ needs.plan.outputs.version }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
