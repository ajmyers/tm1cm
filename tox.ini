[tox]
envlist = py{311,312,313,314}
minversion = 4.0
isolated_build = true

[testenv]
extras = test
# The TM1 testcontainers settings: without them the integration tests skip
passenv =
    TM1_*
    DOCKER_HOST
    TESTCONTAINERS_*
commands =
    flake8 src/tm1cm/ --ignore E501,W291
    pytest -v {posargs}

[flake8]
exclude = .tox,*.egg,build,data
select = E,W,F
